# ─────────────────────────────────────────────────────────────────────────────
#  CI/CD Pipeline
#
#    CI (pull_request → main):  install → lint → test → build → Docker build test
#    CD (push → main):          multi-arch image build → GHCR publish →
#                                SSH zero-downtime deploy
#
#  Images are published to GitHub Container Registry (GHCR) as:
#    ghcr.io/<owner>/<repo>/frontend:{latest,<sha>}
#    ghcr.io/<owner>/<repo>/backend:{latest,<sha>}
#
#  Required repository secrets (Settings → Secrets and variables → Actions):
#    DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PORT (optional)
#  GHCR auth uses the built-in GITHUB_TOKEN — no extra secrets needed.
#
#  NOTE: workflows only auto-trigger from the repo ROOT .github/workflows/.
#  Copy this file to your repository root to activate it.
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }} # immutable tag for every commit + rollback

jobs:
  # ── Continuous Integration: gate every pull request ───────────────────────
  ci:
    name: CI — Lint, Test & Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend — install, lint, build
        working-directory: devops-pipeline/frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Backend — install, lint, test, build
        working-directory: devops-pipeline/backend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Verify Docker images assemble
        working-directory: devops-pipeline
        run: |
          docker build -f frontend/Dockerfile -t ci-frontend .
          docker build -f backend/Dockerfile -t ci-backend .

  # ── Continuous Deployment: publish & ship on main ─────────────────────────
  cd:
    name: CD — Publish Images & Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image base (GHCR requires lowercase)
        # GHA expressions can't lowercase, so derive it via bash parameter expansion
        run: echo "IMAGE_BASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: devops-pipeline
          file: devops-pipeline/frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: devops-pipeline
          file: devops-pipeline/backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production (zero-downtime)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd ~/pipeline-demo || exit 1
            git pull --ff-only origin main
            bash deploy.sh
